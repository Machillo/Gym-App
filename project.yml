name: Sistema
options:
  bundleIdPrefix: com.kennethalvarado
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Poné acá el Team ID de tu Personal Team (o elegilo en Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  Sistema:
    type: application
    platform: iOS
    sources:
      - Sistema
    settings:
      base:
        # Cambialo si Xcode dice que el bundle ID ya está en uso.
        PRODUCT_BUNDLE_IDENTIFIER: com.kennethalvarado.sistema
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sistema
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  SistemaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SistemaTests
    dependencies:
      - target: Sistema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kennethalvarado.sistema.tests
  SistemaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SistemaUITests
    dependencies:
      - target: Sistema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kennethalvarado.sistema.uitests
        TEST_TARGET_NAME: Sistema
schemes:
  Sistema:
    build:
      targets:
        Sistema: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SistemaTests
        - SistemaUITests
