<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title>Life RPG</title>

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages/login.css" />
  </head>

  <body>
    <div class="login-screen">
      <header class="system-header">
        <h1>LIFE RPG</h1>

        <p>Choose Your Character</p>
      </header>

      <section class="profile-select">
        <h2>Select Profile</h2>

        <div class="profile-cards">
          <button class="profile-card active-profile">
            <img src="/img/profile-kenneth.png" alt="Kenneth" />

            <h3>Kenneth</h3>

            <p>Main Save</p>
          </button>

          <button class="profile-card locked">
            <img src="/img/profile-taylor.jpeg" alt="Taylor" />

            <h3>Taylor</h3>

            <p>Locked</p>
          </button>
        </div>
      </section>

      <section id="login-panel" class="hidden">
        <h2>Profile Authentication</h2>

        <form id="login-form">
          <label> Username </label>
          <input type="text" id="user-input" placeholder="Username" />

          <label> Password </label>
          <input type="password" id="pass-input" placeholder="Password" />

          <div class="remember-box">
            <input type="checkbox" id="remember" />
            <label for="remember"> Remember this device </label>
          </div>

          <button type="submit">Enter</button>
        </form>
      </section>
      <footer class="system-footer">
        <p>Version Alpha 0.1</p>

        <p>Solo Progress System</p>
      </footer>
    </div>
  </body>
  <script src="/js/auth.js"></script>
</html>
